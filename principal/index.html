<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>HQuantum Tweaks</title>
    <link rel="icon" type="image/x-icon" href="icon1.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #050505;
            --bg-secondary: #0a0a0a;
            --bg-card: #111111;
            --bg-card-hover: #161616;
            --text-primary: #f5f5f5;
            --text-secondary: #888888;
            --accent: #1a73e8;
            --accent-hover: #2b84f0;
            --accent-translucent: rgba(26, 115, 232, 0.15);
            --border: #1f1f1f;
            --border-hover: #2a2a2a;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #00d68f;
            --danger: #ff4757;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body {
            background: var(--bg-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0a0a0a 0%, #050505 100%);
        }
        .animated-bg::before {
            content: ""; position: absolute; top: -20%; left: -20%; width: 70%; height: 70%;
            background: radial-gradient(circle, rgba(26, 115, 232, 0.08) 0%, transparent 70%);
            filter: blur(120px); animation: floatMorph 16s infinite alternate ease-in-out;
        }
        .animated-bg::after {
            content: ""; position: absolute; bottom: -10%; right: -10%; width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(26, 115, 232, 0.06) 0%, transparent 70%);
            filter: blur(100px); animation: floatMorph 20s infinite alternate-reverse ease-in-out;
        }
        @keyframes floatMorph {
            0% { transform: translate(0,0) scale(1); opacity: 0.5; }
            50% { opacity: 0.8; }
            100% { transform: translate(4%,4%) scale(1.3); opacity: 1; }
        }
        .grid-background {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none; z-index: -1;
        }
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1rem;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-spinner-large {
            width: 40px; height: 40px; border: 3px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-secondary); font-size: 0.9rem; }
        .dynamic-island {
            position: sticky; top: 0.75rem; z-index: 100; display: flex; justify-content: center;
            pointer-events: none; margin-bottom: 2rem; padding: 0 1rem;
        }
        .nav-pill {
            pointer-events: auto; background: rgba(10,10,10,0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 50px; padding: 0.35rem 0.75rem;
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; max-width: 1100px; border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: var(--transition);
        }
        .logo {
            font-weight: 700; font-size: 1.1rem; letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; white-space: nowrap; user-select: none; padding: 0 0.5rem;
        }
        .hamburger {
            display: none; background: var(--accent-translucent); border: 1px solid var(--border);
            color: var(--text-primary); font-size: 1.1rem; cursor: pointer;
            padding: 0.4rem 0.6rem; border-radius: 50%; transition: var(--transition);
        }
        .hamburger:hover { background: var(--accent); border-color: var(--accent); }
        .nav-links { display: flex; gap: 0.2rem; align-items: center; }
        .nav-link {
            background: transparent; border: none; color: var(--text-secondary);
            font-family: inherit; font-weight: 500; font-size: 0.8rem;
            padding: 0.5rem 1rem; border-radius: 50px; cursor: pointer;
            transition: var(--transition); white-space: nowrap;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .nav-link i { font-size: 0.85rem; }
        .nav-link:hover { background: var(--accent-translucent); color: var(--text-primary); }
        .nav-link.active {
            background: var(--accent-translucent); color: var(--accent-hover);
            border: 1px solid rgba(26,115,232,0.3);
        }
        .layout-container {
            display: flex; max-width: 1400px; margin: 0 auto;
            padding: 0 1.25rem 2rem; gap: 1.5rem; position: relative; z-index: 1;
        }
        .main-content-area { flex: 1; min-width: 0; }
        .banner-ad-container {
            width: 100%; margin-bottom: 2rem; border-radius: var(--radius-md);
            overflow: hidden; background: var(--bg-card); border: 1px solid var(--border);
        }
        .banner-carousel { position: relative; overflow: hidden; border-radius: var(--radius-md); }
        .banner-track { display: flex; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); }
        .banner-slide { min-width: 100%; display: flex; justify-content: center; align-items: center; }
        .banner-slide img { width: 100%; height: 280px; object-fit: cover; display: block; }
        .banner-dots { display: flex; justify-content: center; gap: 0.4rem; padding: 0.75rem; background: var(--bg-card); }
        .banner-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary);
            border: none; cursor: pointer; transition: var(--transition); opacity: 0.5;
        }
        .banner-dot.active { background: var(--accent); opacity: 1; transform: scale(1.3); }
        .about-section { margin-bottom: 2rem; }
        .about-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: -0.4px; }
        .about-text {
            color: var(--text-secondary); font-size: 0.9rem; line-height: 1.7;
            background: var(--bg-card); border-radius: var(--radius-md);
            padding: 1.5rem; border: 1px solid var(--border);
        }
        .about-text strong { color: var(--text-primary); font-weight: 600; }
        .tweaks-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem; margin-bottom: 2rem;
        }
        .tweak-card {
            background: var(--bg-card); border-radius: var(--radius-md); padding: 1.5rem;
            border: 1px solid var(--border); transition: var(--transition);
            animation: fadeInUp 0.4s ease backwards;
        }
        .tweak-card:hover {
            transform: translateY(-4px); border-color: var(--border-hover);
            background: var(--bg-card-hover); box-shadow: var(--shadow);
        }
        .tweak-icon {
            width: 40px; height: 40px; border-radius: 50%; background: var(--accent-translucent);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 0.75rem; color: var(--accent-hover); font-size: 1.1rem;
        }
        .tweak-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .tweak-desc { color: var(--text-secondary); font-size: 0.8rem; line-height: 1.6; }
        .app-section {
            background: var(--bg-card); border-radius: var(--radius-lg); padding: 2.5rem;
            border: 1px solid var(--border); text-align: center;
            max-width: 750px; margin: 0 auto; position: relative; overflow: hidden;
        }
        .app-section::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(26,115,232,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .app-icon {
            width: 90px; height: 90px; border-radius: 22px; background: var(--accent-translucent);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem; color: var(--accent-hover); font-size: 2.2rem;
            border: 1px solid rgba(26,115,232,0.3);
        }
        .app-os-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: linear-gradient(135deg, rgba(26,115,232,0.2), rgba(26,115,232,0.05));
            border: 1px solid rgba(26,115,232,0.4);
            padding: 0.5rem 1.2rem; border-radius: 50px;
            font-size: 1.05rem; font-weight: 700; letter-spacing: 0.5px;
            margin-bottom: 1.25rem; color: var(--accent-hover);
        }
        .app-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 1rem; letter-spacing: -0.5px; }
        .app-desc {
            color: var(--text-secondary); font-size: 0.95rem; line-height: 1.8;
            margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;
        }
        .app-desc strong { color: var(--text-primary); font-weight: 600; }
        .btn-download {
            display: inline-flex; align-items: center; gap: 0.75rem;
            padding: 0.9rem 2.5rem; background: var(--accent); color: white;
            border: none; border-radius: 50px; font-size: 1rem; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: var(--transition);
            text-decoration: none; position: relative; overflow: hidden;
        }
        .btn-download::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }
        .btn-download:hover::before { left: 100%; }
        .btn-download:hover {
            background: var(--accent-hover);
            box-shadow: 0 10px 30px rgba(26,115,232,0.4);
            transform: translateY(-2px);
        }
        .btn-download i { font-size: 1.1rem; }
        .account-section {
            background: var(--bg-card); border-radius: var(--radius-md); padding: 2rem;
            border: 1px solid var(--border); max-width: 520px; margin: 0 auto;
        }
        .account-header {
            display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
            padding-bottom: 1rem; border-bottom: 1px solid var(--border);
        }
        .account-avatar {
            width: 50px; height: 50px; border-radius: 50%; background: var(--accent-translucent);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-hover); font-size: 1.2rem;
        }
        .account-info h3 { font-size: 1.1rem; font-weight: 600; }
        .account-info p { color: var(--text-secondary); font-size: 0.8rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block; color: var(--text-secondary); font-size: 0.75rem;
            font-weight: 500; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%; padding: 0.7rem 1rem; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            color: var(--text-primary); font-size: 0.9rem; font-family: inherit;
            transition: var(--transition); outline: none;
        }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-translucent); }
        .btn-primary {
            width: 100%; padding: 0.7rem; background: var(--accent); color: white;
            border: none; border-radius: 50px; font-size: 0.85rem; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 8px 20px rgba(26,115,232,0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-logout {
            width: 100%; padding: 0.7rem; background: transparent; color: var(--danger);
            border: 1px solid rgba(255,71,87,0.3); border-radius: 50px; font-size: 0.85rem;
            font-weight: 600; font-family: inherit; cursor: pointer; transition: var(--transition); margin-top: 0.75rem;
        }
        .btn-logout:hover { background: rgba(255,71,87,0.1); }
        .btn-danger {
            width: 100%; padding: 0.7rem; background: transparent; color: var(--danger);
            border: 1px solid rgba(255,71,87,0.4); border-radius: 50px; font-size: 0.85rem;
            font-weight: 600; font-family: inherit; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-danger:hover { background: rgba(255,71,87,0.15); }
        .message {
            padding: 0.7rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem;
            font-size: 0.8rem; display: none; animation: slideDown 0.3s ease;
        }
        .message.error { background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3); color: var(--danger); }
        .message.success { background: rgba(0,214,143,0.1); border: 1px solid rgba(0,214,143,0.3); color: var(--success); }
        .license-status {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
            border-radius: var(--radius-sm); margin-bottom: 1rem;
            background: var(--bg-secondary); border: 1px solid var(--border);
        }
        .license-status i { color: var(--accent-hover); font-size: 1.2rem; }
        .license-status.active { border-color: rgba(0,214,143,0.3); background: rgba(0,214,143,0.05); }
        .license-status.active i { color: var(--success); }
        .license-purchase {
            text-align: center; padding: 2rem; background: var(--bg-card);
            border-radius: var(--radius-lg); border: 1px solid var(--border);
            max-width: 440px; margin: 0 auto;
        }
        .license-product-img {
            width: 150px; height: 150px; object-fit: contain;
            margin: 0 auto 1.5rem; display: block;
            filter: drop-shadow(0 10px 30px rgba(26,115,232,0.3));
        }
        .license-product-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .license-product-desc { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .btn-purchase {
            display: inline-flex; align-items: center; gap: 0.6rem;
            padding: 0.85rem 2rem; background: var(--accent); color: white;
            border: none; border-radius: 50px; font-size: 0.9rem; font-weight: 600;
            font-family: inherit; cursor: pointer; transition: var(--transition);
            text-decoration: none;
        }
        .btn-purchase:hover {
            background: var(--accent-hover);
            box-shadow: 0 10px 25px rgba(26,115,232,0.4);
            transform: translateY(-2px);
        }
        /* Info grid para Keys */
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.25rem;
        }
        .info-item {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 0.85rem 1rem;
        }
        .info-item .label {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-secondary); margin-bottom: 0.3rem; display: block;
        }
        .info-item .value {
            font-size: 0.9rem; font-weight: 600; color: var(--text-primary);
            word-break: break-all;
        }
        .info-item.full { grid-column: 1 / -1; }
        .info-item.accent .value { color: var(--accent-hover); }
        .info-item.success .value { color: var(--success); }
        .info-item.danger .value { color: var(--danger); }
        .days-badge {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.35rem 0.8rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600;
            margin-bottom: 1rem;
        }
        .days-badge.ok { background: rgba(0,214,143,0.12); color: var(--success); border: 1px solid rgba(0,214,143,0.3); }
        .days-badge.warn { background: rgba(255,193,7,0.12); color: #ffc107; border: 1px solid rgba(255,193,7,0.3); }
        .days-badge.expired { background: rgba(255,71,87,0.12); color: var(--danger); border: 1px solid rgba(255,71,87,0.3); }
        .keys-section { max-width: 560px; margin: 0 auto; }
        /* Términos */
        .terms-content h3 {
            font-size: 1rem; font-weight: 700; margin: 1.5rem 0 0.6rem;
            color: var(--text-primary);
        }
        .terms-content h3:first-child { margin-top: 0; }
        .terms-content p, .terms-content li {
            color: var(--text-secondary); font-size: 0.88rem; line-height: 1.75;
            margin-bottom: 0.5rem;
        }
        .terms-content ul { padding-left: 1.25rem; margin-bottom: 1rem; }
        .terms-content strong { color: var(--text-primary); }
        .terms-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: var(--accent-translucent); border: 1px solid rgba(26,115,232,0.3);
            padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.8rem; font-weight: 600;
            color: var(--accent-hover); margin-bottom: 1.25rem;
        }
        /* Link términos en footer */
        .footer-profesional {
            margin-top: 2rem; background: var(--bg-secondary); border-top: 1px solid var(--border);
            padding: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.8rem;
        }
        .footer-profesional .footer-links {
            display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }
        .footer-profesional .footer-links button {
            background: none; border: none; color: var(--text-secondary);
            font-family: inherit; font-size: 0.8rem; cursor: pointer;
            transition: var(--transition); padding: 0.25rem 0;
        }
        .footer-profesional .footer-links button:hover { color: var(--accent-hover); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .nav-links {
                position: fixed; top: 60px; left: 0.75rem; right: 0.75rem;
                background: rgba(10,10,10,0.98); backdrop-filter: blur(30px);
                -webkit-backdrop-filter: blur(30px); flex-direction: column; padding: 1rem;
                border-radius: var(--radius-md); gap: 0.4rem; border: 1px solid var(--border-hover);
                transform: translateY(-120%); opacity: 0; pointer-events: none;
                transition: all 0.35s cubic-bezier(0.2,0.9,0.4,1.1); z-index: 99;
            }
            .nav-links.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
            .nav-link { width: 100%; justify-content: center; padding: 0.7rem; }
            .nav-pill { padding: 0.3rem 0.6rem; }
            .logo { font-size: 0.95rem; }
            .tweaks-grid { grid-template-columns: 1fr; }
            .banner-slide img { height: 180px; }
            .app-section { padding: 1.5rem; }
            .license-product-img { width: 120px; height: 120px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner-large"></div>
        <div class="loading-text">Verificando sesión...</div>
    </div>

    <div class="animated-bg"></div>
    <div class="grid-background"></div>

    <div class="dynamic-island" id="mainContent" style="display:none;">
        <nav class="nav-pill" aria-label="Navegación principal">
            <span class="logo">HQUANTUM</span>
            <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú" aria-expanded="false">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-links" id="navLinks" role="navigation">
                <button class="nav-link active" data-section="inicio"><i class="fas fa-home"></i> Inicio</button>
                <button class="nav-link" data-section="app"><i class="fas fa-download"></i> Aplicación</button>
                <button class="nav-link" data-section="keys"><i class="fas fa-key"></i> Keys</button>
                <button class="nav-link" data-section="account"><i class="fas fa-user"></i> Cuenta</button>
            </div>
        </nav>
    </div>

    <div class="layout-container" id="layoutContainer" style="display:none;">
        <main class="main-content-area" id="mainContentArea"></main>
    </div>

    <footer class="footer-profesional" id="footerContent" style="display:none;">
        <div class="footer-links">
            <button onclick="renderSection('terminos')">Términos y Condiciones</button>
            <button onclick="renderSection('privacidad')">Política de Privacidad</button>
            <button onclick="renderSection('seguridad')">Seguridad</button>
        </div>
        <span>© 2026 HQuantum Tweaks — Optimización Profesional</span>
    </footer>

    <script>
        if (window.__hq_index_running) {
            throw new Error('Index already running');

        // Devuelve un objeto { year, month (1-12), day } correspondiente
        // a la fecha actual en España (Europe/Madrid).
        function getMadridToday() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Europe/Madrid',
                year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date());
            const get = (t) => parseInt(parts.find(p => p.type === t).value, 10);
            return { year: get('year'), month: get('month'), day: get('day') };
        }

        // Suma N meses a una fecha {year, month, day} y fija la hora a 00:00.
        // Gestiona correctamente el desbordamiento de meses (ej. 31 enero + 1 mes → 28/29 feb).
        function addMonthsAtMidnight(dateObj, months) {
            let { year, month, day } = dateObj;
            // Normalizamos: month index 0-11
            const totalMonthIndex = (year * 12 + (month - 1)) + months;
            const newYear = Math.floor(totalMonthIndex / 12);
            const newMonth = (totalMonthIndex % 12) + 1;
            // Día máximo del mes destino
            const maxDay = new Date(newYear, newMonth, 0).getDate();
            const newDay = Math.min(day, maxDay);
            return { year: newYear, month: newMonth, day: newDay };
        }

        // Formatea {year, month, day} como "YYYY-MM-DD 00:00"
        function formatDateISO(dateObj) {
            const y = dateObj.year;
            const m = String(dateObj.month).padStart(2, '0');
            const d = String(dateObj.day).padStart(2, '0');
            return `${y}-${m}-${d} 00:00`;
        }

        // Calcula la fecha de expiración: hoy (España) + 1 mes, a las 00:00
        function computeExpirationTime() {
            const today = getMadridToday();
            const next = addMonthsAtMidnight(today, 1);
            return formatDateISO(next);
        }

        // Parsea "YYYY-MM-DD 00:00" a Date local (mediodía para evitar líos de TZ)
        function parseExpiration(timeStr) {
            if (!timeStr) return null;
            const m = String(timeStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (!m) return null;
            // Usamos mediodía UTC del día indicado; para comparar días es suficiente
            return new Date(Date.UTC(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10), 12, 0, 0));
        }

        // Días restantes (puede ser negativo si expiró)
        function daysRemaining(timeStr) {
            const exp = parseExpiration(timeStr);
            if (!exp) return null;
            // Hoy en Madrid a mediodía (UTC)
            const todayParts = getMadridToday();
            const todayUTC = Date.UTC(todayParts.year, todayParts.month - 1, todayParts.day, 12, 0, 0);
            const diffMs = exp.getTime() - todayUTC;
            return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
        }

                    showKeyMessage('keyError', 'Usuario no encontrado');
                    return;
                }
                if (users[userIndex].Password !== password) {
                    showKeyMessage('keyError', 'Contraseña incorrecta');
                    return;
                }

                users[userIndex].License = "";
                users[userIndex].Time = "";
                users[userIndex].UUID = "";

                await updateFile(FILE_PATH, users, sha, 'Unlink license');

                currentUser.License = "";
                currentUser.Time = "";
                currentUser.UUID = "";
                localStorage.setItem('hquantum_user', JSON.stringify(currentUser));

                showKeyMessage('keySuccess', 'Key desvinculada correctamente');
                setTimeout(() => renderKeys(), 1200);
            } catch (error) {
                showKeyMessage('keyError', 'Error: ' + error.message);
            }
        }

        function showKeyMessage(id, text) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4500);
        }

        /* ============================================================
           RENDER: CUENTA
           ============================================================ */

        function renderAccount() {
            mainArea.innerHTML = `
                <div class="account-section">
                    <div class="account-header">
                        <div class="account-avatar"><i class="fas fa-user"></i></div>
                        <div class="account-info">
                            <h3>${currentUser.Username}</h3>
                            <p>${currentUser.License ? 'Licencia: ' + currentUser.License : 'Sin licencia'}</p>
                        </div>
                    </div>
                    <div class="message error" id="accountError"></div>
                    <div class="message success" id="accountSuccess"></div>
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" id="newUsername" value="${currentUser.Username}">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="newPassword" placeholder="Dejar vacío para no cambiar">
                    </div>
                    <button class="btn-primary" onclick="updateAccount()">Guardar Cambios</button>
                    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
                </div>
            `;
        }

        window.updateAccount = async function() {
            const newUsername = document.getElementById('newUsername').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            if (!newUsername) {
                showAccountMessage('accountError', 'El usuario no puede estar vacío');
                return;
            }
            try {
                const { data: users, sha } = await fetchFile(FILE_PATH);
                const userIndex = users.findIndex(u => u.Username === currentUser.Username);
                if (userIndex === -1) {
                    showAccountMessage('accountError', 'Usuario no encontrado');
                    return;
                }
                if (newUsername !== currentUser.Username && users.some(u => u.Username === newUsername)) {
                    showAccountMessage('accountError', 'El usuario ya existe');
                    return;
                }
                users[userIndex].Username = newUsername;
                if (newPassword) users[userIndex].Password = newPassword;
                await updateFile(FILE_PATH, users, sha, 'Update user data');
                currentUser.Username = newUsername;
                if (newPassword) currentUser.Password = newPassword;
                localStorage.setItem('hquantum_user', JSON.stringify(currentUser));
                showAccountMessage('accountSuccess', 'Cuenta actualizada correctamente');
                setTimeout(() => renderAccount(), 1500);
            } catch (error) {
                showAccountMessage('accountError', 'Error: ' + error.message);
            }
        };

        function showAccountMessage(id, text) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        window.logout = function() {
            localStorage.removeItem('hquantum_user');
            sessionStorage.setItem('hq_just_logged_out', '1');
            window.location.href = '../index.html';
        };

        /* ============================================================
           NAVEGACIÓN
           ============================================================ */

        function renderSection(section) {
            // Marcar nav-link activo si existe
            document.querySelectorAll('.nav-link').forEach(b => {
                b.classList.toggle('active', b.dataset.section === section);
            });
            switch(section) {
                case 'app': renderApp(); break;
                case 'keys': renderKeys(); break;
                case 'account': renderAccount(); break;
                case 'terminos': renderTerminos(); break;
                case 'privacidad': renderPrivacidad(); break;
                case 'seguridad': renderSeguridad(); break;
                default: renderInicio();
            }
        }
        window.renderSection = renderSection;

        hamburgerBtn.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            hamburgerBtn.setAttribute('aria-expanded', isOpen);
        });

        document.querySelectorAll('.nav-link').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                navLinks.classList.remove('open');
                renderSection(btn.dataset.section);
            });
        });

        /* ============================================================
           INIT
           ============================================================ */

        async function init() {
            try {
                const isValid = await validateSession();
                if (!isValid) return;

                await validateLicense();

                loadingScreen.classList.add('hidden');
                document.getElementById('mainContent').style.display = '';
                document.getElementById('layoutContainer').style.display = '';
                document.getElementById('footerContent').style.display = '';

                renderInicio();
            } catch (err) {
                console.error('[HQuantum Index] Init error:', err);
                loadingScreen.classList.add('hidden');
                document.getElementById('mainContent').style.display = '';
                document.getElementById('layoutContainer').style.display = '';
                document.getElementById('footerContent').style.display = '';
                renderInicio();
            }
        }

        init();
    </script>
