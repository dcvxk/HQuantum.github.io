        async function fetchFile(path) {
            const response = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                headers: {
                    'Authorization': `token ${_0x5e6f}`,
                    'Accept': 'application/vnd.github.v3+json'

            });
            if (!response.ok) throw new Error('Error fetching file: ' + path);

            const storedUser = localStorage.getItem('hquantum_user');
            if (!storedUser) {

                    <h2 class="app-title">HQuantum Tweaks App</h2>
                    <p class="app-desc">
                        <strong>HQuantum Tweaks</strong> es una aplicación de optimización avanzada compatible con 
                        <strong>cualquier sistema operativo</strong>. Diseñada para llevar tu equipo al máximo rendimiento, 
                        consiguiendo <strong>más FPS</strong> y una <strong>estabilidad excepcional</strong> en todos tus juegos.
                        <br><br>
                        Nuestros tweaks modifican configuraciones <strong>profundas del sistema</strong>, 
                        optimizando cada aspecto para que experimentes una fluidez total sin interrupciones.
                    </p>
                    <a href="${APP_DOWNLOAD_URL}" class="btn-download" download>
                        <i class="fas fa-download"></i> Descargar
                    </a>
                </div>
            `;
        }

        function setupBannerCarousel() {
            const track = document.getElementById('bannerTrack');
            const dots = document.querySelectorAll('.banner-dot');
            let currentIndex = 0;
            function goToSlide(index) {
                currentIndex = index;
                track.style.transform = `translateX(-${index * 100}%)`;
                dots.forEach(d => d.classList.remove('active'));
                dots[index].classList.add('active');
            }
            dots.forEach(dot => dot.addEventListener('click', () => goToSlide(parseInt(dot.dataset.index))));
            setInterval(() => goToSlide((currentIndex + 1) % 2), 5000);
        }

        function renderVideos() {
            mainArea.innerHTML = `
                <div class="tweaks-grid">
                    <div class="tweak-card">
                        <div class="tweak-icon"><i class="fab fa-youtube"></i></div>
                        <h3 class="tweak-title">Guía de Optimización</h3>
                        <p class="tweak-desc">Cómo los profesionales optimizan Windows para aumentar FPS.</p>
                    </div>
                    <div class="tweak-card">
                        <div class="tweak-icon"><i class="fas fa-video"></i></div>
                        <h3 class="tweak-title">Regedit Avanzado</h3>
                        <p class="tweak-desc">Mejora tu latencia con tweaks avanzados de registro.</p>
                    </div>
                    <div class="tweak-card">
                        <div class="tweak-icon"><i class="fas fa-film"></i></div>
                        <h3 class="tweak-title">FPS Boost</h3>
                        <p class="tweak-desc">Aumenta FPS con configuraciones exclusivas.</p>
                    </div>
                </div>
            `;
        }

        function renderResultados() {
            mainArea.innerHTML = `
                <div class="about-section">
                    <h2 class="about-title">Resultados</h2>
                    <p class="about-text">Próximamente mostraremos resultados de rendimiento con gráficos comparativos.</p>
                </div>
            `;
        }

        function renderKeys() {
            const hasLicense = currentUser.License && currentUser.License !== "";
            mainArea.innerHTML = `
                <div class="account-section">
                    <div class="account-header">
                        <div class="account-avatar"><i class="fas fa-key"></i></div>
                        <div class="account-info">
                            <h3>Activación de Licencia</h3>
                            <p>Ingresa tu clave para activar el servicio</p>
                        </div>
                    </div>
                    ${hasLicense ? `
                        <div class="license-status active">
                            <i class="fas fa-check-circle"></i>
                            <span>Licencia activa: ${currentUser.License}</span>
                        </div>
                    ` : `
                        <div class="license-status">
                            <i class="fas fa-info-circle"></i>
                            <span>No tienes licencia activa</span>
                        </div>
                    `}
                    <div class="message error" id="keyError"></div>
                    <div class="message success" id="keySuccess"></div>
                    ${!hasLicense ? `
                        <div class="form-group">
                            <label>Clave de Licencia</label>
                            <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX-XXXX">
                        </div>
                        <button class="btn-primary" id="activateBtn" onclick="activateLicense()">
                            <i class="fas fa-check"></i> Activar Licencia
                        </button>
                    ` : ''}
                </div>
            `;
        }

        window.activateLicense = async function() {
            const licenseKey = document.getElementById('licenseKey').value.trim();
            if (!licenseKey) {
                showKeyMessage('keyError', 'Por favor ingresa una clave de licencia');
                return;
            }
            const btn = document.getElementById('activateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:#fff;animation:spin 0.6s linear infinite;display:inline-block;"></span> Verificando...';
            try {
                const { data: licenses, sha: licenseSha } = await fetchFile(LICENSE_FILE_PATH);
                const licenseExists = licenses.some(l => l.License === licenseKey);
                if (!licenseExists) {
                    showKeyMessage('keyError', 'Licencia inválida o ya utilizada');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> Activar Licencia';
                    return;
                }
                const { data: users, sha: usersSha } = await fetchFile(FILE_PATH);
                const userIndex = users.findIndex(u => u.Username === currentUser.Username);
                if (userIndex === -1) {
                    showKeyMessage('keyError', 'Usuario no encontrado');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> Activar Licencia';
                    return;
                }
                users[userIndex].License = licenseKey;
                await updateFile(FILE_PATH, users, usersSha, 'Activate license');
                const updatedLicenses = licenses.filter(l => l.License !== licenseKey);
                await updateFile(LICENSE_FILE_PATH, updatedLicenses, licenseSha, 'Remove used license');
                currentUser.License = licenseKey;
                localStorage.setItem('hquantum_user', JSON.stringify(currentUser));
                showKeyMessage('keySuccess', '¡Licencia activada exitosamente!');
                setTimeout(() => renderKeys(), 1500);
            } catch (error) {
                showKeyMessage('keyError', 'Error: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Activar Licencia';
            }
        };

        function showKeyMessage(id, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function renderAccount() {
            mainArea.innerHTML = `
                <div class="account-section">
                    <div class="account-header">
                        <div class="account-avatar"><i class="fas fa-user"></i></div>
                        <div class="account-info">
                            <h3>${currentUser.Username}</h3>
                            <p>${currentUser.License ? 'Licencia: ' + currentUser.License : 'Sin licencia'}</p>
                        </div>
                    </div>
                    <div class="message error" id="accountError"></div>
                    <div class="message success" id="accountSuccess"></div>
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" id="newUsername" value="${currentUser.Username}">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="newPassword" placeholder="Dejar vacío para no cambiar">
                    </div>
                    <button class="btn-primary" onclick="updateAccount()">Guardar Cambios</button>
                    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
                </div>
            `;
        }

        window.updateAccount = async function() {
            const newUsername = document.getElementById('newUsername').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            if (!newUsername) {
                showAccountMessage('accountError', 'El usuario no puede estar vacío');
                return;
            }
            try {
                const { data: users, sha } = await fetchFile(FILE_PATH);
                const userIndex = users.findIndex(u => u.Username === currentUser.Username);
                if (userIndex === -1) {
                    showAccountMessage('accountError', 'Usuario no encontrado');
                    return;
                }
                if (newUsername !== currentUser.Username && users.some(u => u.Username === newUsername)) {
                    showAccountMessage('accountError', 'El usuario ya existe');
                    return;
                }
                users[userIndex].Username = newUsername;
                if (newPassword) users[userIndex].Password = newPassword;
                await updateFile(FILE_PATH, users, sha, 'Update user data');
                currentUser.Username = newUsername;
                if (newPassword) currentUser.Password = newPassword;
                localStorage.setItem('hquantum_user', JSON.stringify(currentUser));
                showAccountMessage('accountSuccess', 'Cuenta actualizada correctamente');
                setTimeout(() => renderAccount(), 1500);
            } catch (error) {
                showAccountMessage('accountError', 'Error: ' + error.message);
            }
        };

        function showAccountMessage(id, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        window.logout = function() {
            localStorage.removeItem('hquantum_user');
            window.location.href = '../index.html';
        };

        function renderSection(section) {
            switch(section) {
                case 'app': renderApp(); break;
                case 'videos': renderVideos(); break;
                case 'resultados': renderResultados(); break;
                case 'keys': renderKeys(); break;
                case 'account': renderAccount(); break;
                default: renderInicio();
            }
        }

        hamburgerBtn.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            hamburgerBtn.setAttribute('aria-expanded', isOpen);
        });

        document.querySelectorAll('.nav-link').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                navLinks.classList.remove('open');
                renderSection(btn.dataset.section);
            });
        });

        async function init() {
            const isValid = await validateSession();
            if (!isValid) return;
            
            await validateLicense();
            
            loadingScreen.classList.add('hidden');
            document.getElementById('mainContent').style.display = '';
            document.getElementById('layoutContainer').style.display = '';
            document.getElementById('footerContent').style.display = '';
            
            renderInicio();
        }

        init();
    </script>
</body>
</html>
